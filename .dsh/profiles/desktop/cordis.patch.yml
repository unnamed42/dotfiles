# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: openrouter-live
    model: deepseek/deepseek-v4.1-flash
    reasoningEffort: high
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: null
    process: standard
    completion: skipped
    usage: compact
    developerTools: false
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: false
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- id: permission-rules
  config:
    rulesFile: /home/huang/.dsh/profiles/desktop/.dsh/rules.yaml
    badFilePolicy: fail
    maxRules: 256
    patternMode: glob
    watch: true
- id: lsp-actions
  config:
    servers:
      golang:
        command: /home/huang/go/bin/gopls
        args: []
        initializationOptions:
          buildFlags: [ "-tags=manager" ]
        extensionToLanguage:
          ".go": golang
        projectMarkers: [ "go.mod" ]
    editor:
      enabled: false
      requestTimeoutMs: 60000
      diagnosticsCacheMaxFiles: 64
    maxDiagnostics: 200
    maxResultChars: 16000
    maxSymbols: 100
    timeoutMs: 60000
- id: import-claude
  name: dsh-chat-import
  config:
    importSystemPrompt: true
    injectTools: off
- id: sandbox-extra-roots
  name: "@chaoset/sandbox-extra-roots"
  config:
    extraWritableRoots:
      - |-
        ~/.cargo
        ~/go/pkg/mod
        ~/.cache/go
        ~/.cache/go-build
